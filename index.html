<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flat Terrain Mesh</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="admin-menu" class="hidden">
        <h2>Admin Menu</h2>

        <h3>Terrain</h3>
        <div class="control-group">
            <label for="terrain-width">Terrain Width (km)</label>
            <input type="number" id="terrain-width" value="256" step="1">
        </div>
        <div class="control-group">
            <label for="terrain-depth">Terrain Depth (km)</label>
            <input type="number" id="terrain-depth" value="256" step="1">
        </div>

        <h3>Camera</h3>
        <div class="control-group">
            <label for="min-zoom">Min Zoom (m)</label>
            <input type="number" id="min-zoom" value="10" step="1">
        </div>
        <div class="control-group">
            <label for="max-zoom">Max Zoom (m)</label>
            <input type="number" id="max-zoom" value="400000" step="1000">
        </div>

        <button id="generate-terrain">Apply & Regenerate Terrain</button>

        <h3>Import / Export</h3>
        <button id="export-terrain">Export Terrain (JSON)</button>
        <button id="import-terrain">Import Terrain (JSON)</button>
        <input type="file" id="import-file-input" style="display:none" accept=".json">

        <h3>Grid</h3>
        <div class="control-group">
            <label for="grid-cell-size">Grid Cell Size (m)</label>
            <input type="number" id="grid-cell-size" value="1000" step="100">
        </div>
        <div class="control-group">
            <label for="toggle-grid">Show Grid</label>
            <input type="checkbox" id="toggle-grid" checked>
        </div>
    </div>
    <script type="module" src="main.js"></script>

</body>
</html>
