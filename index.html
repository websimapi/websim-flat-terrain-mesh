<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flat Terrain Mesh</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="debug-menu" class="hidden">
        <h2>Debug Menu</h2>
        <div class="control-group">
            <label for="terrain-width">Terrain Width (km)</label>
            <input type="number" id="terrain-width" value="256" step="1">
        </div>
        <div class="control-group">
            <label for="terrain-depth">Terrain Depth (km)</label>
            <input type="number" id="terrain-depth" value="256" step="1">
        </div>
        <div class="control-group">
            <label for="grid-cell-size">Grid Cell Size (m)</label>
            <input type="number" id="grid-cell-size" value="1000" step="100">
        </div>
        <button id="generate-terrain">Generate Terrain</button>
        <div class="control-group">
            <label for="toggle-grid">Show Grid</label>
            <input type="checkbox" id="toggle-grid" checked>
        </div>
    </div>
    <script type="module" src="main.js"></script>

</body>
</html>
